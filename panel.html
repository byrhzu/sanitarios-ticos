<!DOCTYPE html>
<html lang="es-CR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel interno | Sanitarios Ticos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="styles.css?v=20260905c">
<style>
  /* Estilos propios de esta página — una herramienta interna, no una
     página de venta, así que no lleva las animaciones ni el menú del sitio. */
  body { background: var(--paper-2); }
  .panel-shell { max-width: 62rem; margin: 0 auto; padding: clamp(2rem, 5vw, 4rem) var(--gut) 5rem; }
  .panel-top { display: flex; align-items: center; gap: .9rem; margin-bottom: 2rem; }
  .panel-top img { height: 34px; width: auto; }
  .panel-top span { font-family: var(--display); font-weight: 700; font-size: 1.1rem; }

  .llave { max-width: 26rem; margin: 4rem auto; text-align: center; }
  .llave .f { text-align: left; margin: 1.3rem 0; }

  /* Pestañas. Sin bordes ni cajas: la que está activa se marca con una
     línea gruesa abajo, como la navegación del sitio. */
  .pestanas { display: flex; gap: .3rem; margin-bottom: 1.6rem; flex-wrap: wrap; }
  .pestanas button {
    font-family: var(--display); font-weight: 600; font-size: .92rem;
    color: var(--muted); padding: .5rem .1rem; margin-right: 1.1rem;
    border-bottom: 3px solid transparent;
    transition: color .2s var(--ease), border-color .2s var(--ease);
  }
  .pestanas button:hover { color: var(--ink); }
  .pestanas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--orange); }

  .aviso[hidden] { display: none; }
  .aviso {
    display: block;
    background: var(--orange-soft); color: var(--orange-dk);
    padding: .8rem 1rem; margin-bottom: 1.2rem;
    font-size: .88rem; line-height: 1.45;
  }

  .filtros { display: grid; gap: .9rem; grid-template-columns: 1fr 1fr auto auto; align-items: end; margin-bottom: 1.6rem; }
  @media (max-width: 719px) { .filtros { grid-template-columns: 1fr 1fr; } .filtros .btn { grid-column: span 1; } }

  .tabla-wrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); }
  table.solicitudes { width: 100%; border-collapse: collapse; font-size: .89rem; white-space: nowrap; }
  table.solicitudes th, table.solicitudes td { padding: .7rem .9rem; border-bottom: 1px solid var(--line); text-align: left; }
  table.solicitudes th { font-family: var(--display); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--paper-2); }
  table.solicitudes td.detalle { white-space: normal; min-width: 16rem; color: var(--ink-2); }
  table.solicitudes tr:last-child td { border-bottom: 0; }

  .estado-panel { font-size: .9rem; color: var(--muted); margin: 1rem 0; }
  .estado-panel.is-error { color: #c0392b; }

  .paginacion[hidden] { display: none; }
  .paginacion {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap; margin-top: 1.2rem;
  }
  .paginacion-txt { font-size: .88rem; color: var(--muted); }
  .paginacion .btn:disabled { opacity: .4; cursor: default; }
  .paginacion .btn:disabled:hover { background: none; border-color: var(--line-2); color: var(--ink); }
  .vacio { padding: 3rem 1rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div class="panel-shell">
  <div class="panel-top">
    <img src="assets/img/logo-mascota.webp" alt="" width="34" height="34">
    <span>Panel interno</span>
  </div>

  <!-- Se ve mientras no se haya escrito la clave correcta -->
  <section class="llave" id="pantalla-clave">
    <p class="kicker" style="justify-content:center; display:flex;">Acceso privado</p>
    <h1 style="font-size:1.6rem;">Solicitudes y cotizaciones</h1>
    <p class="dim" style="margin-top:.6rem;">Ingrese la clave para ver y descargar lo que ha entrado por el sitio.</p>
    <form id="form-clave">
      <div class="f">
        <label for="clave">Clave</label>
        <input type="password" id="clave" autocomplete="current-password" required>
      </div>
      <button class="btn btn-orange" type="submit" style="width:100%;">Entrar</button>
      <p class="estado-panel" id="estado-clave" role="status" aria-live="polite"></p>
    </form>
  </section>

  <!-- Se ve después de entrar la clave correcta -->
  <section id="pantalla-panel" hidden>
    <div class="pestanas" role="tablist" aria-label="Qué mostrar">
      <button type="button" role="tab" id="tab-solicitudes" data-tabla="solicitudes" aria-selected="true">Solicitudes</button>
      <button type="button" role="tab" id="tab-cotizaciones" data-tabla="cotizaciones" aria-selected="false">Cotizaciones</button>
    </div>

    <p class="aviso" id="aviso-provisional" hidden>
      Estas cotizaciones salieron con las <b>tarifas provisionales</b>, que no son las
      de la empresa. Sirven para ver que el sistema funciona, no para cobrar.
    </p>

    <div class="filtros">
      <div class="f">
        <label for="desde">Desde</label>
        <input type="date" id="desde">
      </div>
      <div class="f">
        <label for="hasta">Hasta</label>
        <input type="date" id="hasta">
      </div>
      <button class="btn btn-line" type="button" id="btn-filtrar">Filtrar</button>
      <button class="btn btn-orange" type="button" id="btn-csv">Descargar CSV</button>
    </div>

    <p class="estado-panel" id="estado-lista" role="status" aria-live="polite"></p>

    <div class="tabla-wrap">
      <table class="solicitudes" id="tabla">
        <thead><tr id="encabezado-tabla"></tr></thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>

    <!-- Paginación. El panel traía todas las solicitudes de golpe; con
         unos miles el teléfono se arrastra. Ahora vienen de 50 en 50. -->
    <div class="paginacion" id="paginacion" hidden>
      <button class="btn btn-line" type="button" id="btn-antes">&larr; Anteriores</button>
      <span class="paginacion-txt" id="paginacion-txt" role="status" aria-live="polite"></span>
      <button class="btn btn-line" type="button" id="btn-despues">Siguientes &rarr;</button>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var clave = sessionStorage.getItem("clavePanel") || "";

  function escHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function mostrarPanel() {
    $("pantalla-clave").hidden = true;
    $("pantalla-panel").hidden = false;
    cargar();
  }

  var pagina = 1;
  var tabla = "solicitudes";

  function urlConFiltros(base, conPagina) {
    var params = new URLSearchParams();
    params.set("tabla", tabla);
    if ($("desde").value) params.set("desde", $("desde").value);
    if ($("hasta").value) params.set("hasta", $("hasta").value);
    if (conPagina && pagina > 1) params.set("pagina", String(pagina));
    return base + "?" + params.toString();
  }

  function pintarPaginacion(d) {
    var caja = $("paginacion");
    var total = d.total || 0;
    var paginas = d.paginas || 1;

    if (!total) { caja.hidden = true; return; }

    var primera = (d.pagina - 1) * d.porPagina + 1;
    var ultima = Math.min(d.pagina * d.porPagina, total);
    var cosa = tabla === "cotizaciones" ? "cotización" : "solicitud";
    $("estado-lista").textContent =
      total === 1 ? "1 " + cosa + "."
                  : "Mostrando " + primera + " a " + ultima + " de " + total + ".";

    // Los botones sólo aparecen si de verdad hay a dónde ir.
    caja.hidden = paginas <= 1;
    $("btn-antes").disabled = d.pagina <= 1;
    $("btn-despues").disabled = d.pagina >= paginas;
    $("paginacion-txt").textContent = "Página " + d.pagina + " de " + paginas;
  }

  /* Las columnas las decide el servidor, no esta página: así la tabla
     de cotizaciones y la de solicitudes usan el mismo código, y lo que
     se ve en pantalla nunca se desalinea del CSV que se descarga. */
  function pintarFilas(d) {
    var cuerpo = $("cuerpo-tabla");

    $("encabezado-tabla").innerHTML = (d.encabezado || []).map(function (t) {
      return "<th>" + escHtml(t) + "</th>";
    }).join("");

    if (!d.filas.length) {
      cuerpo.innerHTML = "";
      $("estado-lista").textContent = tabla === "cotizaciones"
        ? "No hay cotizaciones en ese rango de fechas."
        : "No hay solicitudes en ese rango de fechas.";
      $("paginacion").hidden = true;
      return;
    }

    cuerpo.innerHTML = d.filas.map(function (fila) {
      return "<tr>" + fila.map(function (celda, i) {
        // La columna "ancha" (el detalle, el tipo de propiedad) es la
        // única que puede partirse en varias líneas.
        var cls = i === d.ancha ? ' class="detalle"' : "";
        return "<td" + cls + ">" + escHtml(celda) + "</td>";
      }).join("") + "</tr>";
    }).join("");
  }

  function cargar() {
    $("estado-lista").textContent = "Cargando…";
    $("estado-lista").classList.remove("is-error");
    fetch(urlConFiltros("/api/panel/solicitudes", true), { headers: { "X-Clave": clave } })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok || !res.d.ok) throw new Error(res.d && res.d.error);
        pintarFilas(res.d);
        pintarPaginacion(res.d);
        $("aviso-provisional").hidden = !res.d.hayProvisionales;
        // Al cambiar de página, volver arriba: si no, uno queda mirando
        // el final de una lista que ya cambió.
        window.scrollTo({ top: 0, behavior: "smooth" });
      })
      .catch(function () {
        $("estado-lista").textContent = "No se pudo cargar. Intente de nuevo.";
        $("estado-lista").classList.add("is-error");
      });
  }

  $("form-clave").addEventListener("submit", function (e) {
    e.preventDefault();
    var intento = $("clave").value;
    $("estado-clave").textContent = "Comprobando…";
    $("estado-clave").classList.remove("is-error");
    fetch("/api/panel/solicitudes", { headers: { "X-Clave": intento } })
      .then(function (r) {
        // Distinguir el "no es la clave" del "el servidor está mal" evita
        // pasar horas cambiando una contraseña que nunca fue el problema.
        if (r.status === 401) throw new Error("clave");
        if (!r.ok) throw new Error("servidor:" + r.status);
        return r.json();
      })
      .then(function () {
        clave = intento;
        sessionStorage.setItem("clavePanel", clave);
        $("estado-clave").textContent = "";
        mostrarPanel();
      })
      .catch(function (err) {
        var msg = String(err && err.message);
        if (msg === "clave") {
          $("estado-clave").textContent =
            "Clave incorrecta. Si acaba de cambiarla en Cloudflare, revise que " +
            "esté guardada como Secret (no como Variable) y que el Worker se haya vuelto a desplegar.";
        } else if (msg.indexOf("servidor:") === 0) {
          $("estado-clave").textContent = "El servidor respondió con un error (" + msg.slice(9) + "). No es la clave.";
        } else {
          $("estado-clave").textContent = "No se pudo contactar al servidor. Revise la conexión.";
        }
        $("estado-clave").classList.add("is-error");
      });
  });

  // Al cambiar el filtro se vuelve a la página 1: quedarse en la 7 de un
  // rango que ahora tiene 2 páginas deja la tabla vacía sin explicación.
  $("btn-filtrar").addEventListener("click", function () { pagina = 1; cargar(); });

  // Las pestañas comparten el rango de fechas a propósito: casi siempre
  // uno quiere ver las solicitudes y las cotizaciones del mismo periodo.
  Array.prototype.forEach.call(document.querySelectorAll(".pestanas button"), function (b) {
    b.addEventListener("click", function () {
      if (b.dataset.tabla === tabla) return;
      tabla = b.dataset.tabla;
      pagina = 1;
      Array.prototype.forEach.call(document.querySelectorAll(".pestanas button"), function (o) {
        o.setAttribute("aria-selected", String(o === b));
      });
      $("aviso-provisional").hidden = true;
      $("cuerpo-tabla").innerHTML = "";
      cargar();
    });
  });

  $("btn-antes").addEventListener("click", function () {
    if (pagina > 1) { pagina--; cargar(); }
  });
  $("btn-despues").addEventListener("click", function () { pagina++; cargar(); });

  $("btn-csv").addEventListener("click", function () {
    // El archivo necesita la clave, pero una descarga no puede llevar
    // encabezados personalizados: por eso acá sí va como parámetro en
    // la URL. Sólo viaja por HTTPS, igual que el resto de la página.
    var params = new URLSearchParams();
    params.set("tabla", tabla);
    if ($("desde").value) params.set("desde", $("desde").value);
    if ($("hasta").value) params.set("hasta", $("hasta").value);
    params.set("clave", clave);
    window.location.href = "/api/panel/csv?" + params.toString();
  });

  // Si ya había una clave guardada de una visita anterior en esta pestaña,
  // se entra directo sin volver a pedirla.
  if (clave) mostrarPanel();
})();
</script>

</body>
</html>
